name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    # The suite runs ~10 minutes on GitHub (56 browser tests, software WebGL); room for a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
